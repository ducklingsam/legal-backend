<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <a href="/" style="
    position: absolute;
    top: 1rem;
    left: 1rem;
    padding: 0.5rem 1rem;
    background-color: #eee;
    color: #333;
    text-decoration: none;
    border-radius: 4px;
    font-size: 0.9rem;
    ">← На главную
  </a>
  <title>Поиск похожих патентов</title>
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background-color: #f5f5f5;
    }

    .screen {
      display: none;
      height: 100vh;
      width: 100vw;
      box-sizing: border-box;
      padding: 2rem;
      background-color: #fff;
      overflow: auto;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .screen.active {
      display: flex;
    }

    .container {
      width: 90%;
      max-width: 1000px;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
      font-size: 2rem;
    }

    form {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    textarea {
      padding: 0.5rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 0.5rem;
      resize: vertical;
      min-height: 120px;
    }

    button {
      margin-top: 1rem;
      padding: 0.75rem;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background-color: #007bff;
      color: #fff;
      cursor: pointer;
    }

    button:hover {
      background-color: #0056b3;
    }

    iframe {
      width: 100%;
      height: 80vh;
      border: none;
    }

    .error-message {
      color: red;
      font-size: 0.875rem;
      margin-top: -0.25rem;
      margin-bottom: 0.5rem;
      display: none;
    }

    a#download-link {
      margin-top: 1rem;
      display: inline-block;
      color: #007bff;
      text-decoration: none;
    }

    a#download-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div id="form-screen" class="screen active">
    <div class="container">
      <h1>Поиск похожих патентов</h1>
      <form id="patent-search-form">
        <label for="patent-description">Описание патента*</label>
        <textarea id="patent-description" name="description" required placeholder="Введите описание"></textarea>
        <span class="error-message">Поле обязательно</span>
        <button type="submit">Найти похожие</button>
        <p id="loading-text" style="display: none; color: #666; text-align: center; margin-top: 1rem;">
          Идёт поиск, пожалуйста, подождите...
        </p>
      </form>
    </div>
  </div>

  <div id="result-screen" class="screen">
    <div class="container">
      <h1>Результат поиска</h1>
      <iframe id="pdf-frame"></iframe>
      <a id="download-link" href="#" download="highlighted_texts.pdf">Скачать PDF</a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('patent-search-form');
      const desc = document.getElementById('patent-description');
      const err = desc.nextElementSibling;
      const pdfFrame = document.getElementById('pdf-frame');
      const downloadLink = document.getElementById('download-link');
      const formScreen = document.getElementById('form-screen');
      const resultScreen = document.getElementById('result-screen');
      const submitBtn = form.querySelector('button[type="submit"]');
      const loadingText = document.getElementById('loading-text');

      form.addEventListener('submit', async e => {
        e.preventDefault();

        // Валидация
        if (!desc.value.trim()) {
          desc.classList.add('invalid');
          err.style.display = 'block';
          return;
        }

        submitBtn.style.display = 'none';
        loadingText.style.display = 'block';

        const formData = new FormData();
        formData.append('description', desc.value);

        try {
          const resp = await fetch('/search_patents', {
            method: 'POST',
            body: formData
          });

          if (resp.ok) {
            const blob = await resp.blob();

            if (blob.size === 0) {
              alert('Пустой файл PDF. Проверь, генерируется ли файл на сервере.');
              submitBtn.style.display = 'block';
              loadingText.style.display = 'none';
              return;
            }

            const url = URL.createObjectURL(blob);
            pdfFrame.src = url;
            downloadLink.href = url;

            formScreen.classList.remove('active');
            resultScreen.classList.add('active');
          } else {
            alert('Ошибка при получении PDF');
            console.error(await resp.text());
            submitBtn.style.display = 'block';
            loadingText.style.display = 'none';
          }
        } catch (err) {
          alert('Ошибка соединения с сервером');
          console.error(err);
          submitBtn.style.display = 'block';
          loadingText.style.display = 'none';
        }
      });

      desc.addEventListener('input', () => {
        if (desc.value.trim()) {
          desc.classList.remove('invalid');
          err.style.display = 'none';
        }
      });
    });
  </script>

</body>

</html>
